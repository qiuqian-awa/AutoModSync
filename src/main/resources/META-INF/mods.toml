[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="秋千"
credits="XiaoArin"
# logoFile="logo.png"
description='''
${mod_description}

核心特性:
1. 四段校验机制: 本地基线差分 -> 强制变更 -> 版本同步 -> 最终合格灯.
2. SHA-1 仓库系统: 模组与高级自定义文件按哈希备份、下载和校验.
3. 智能抵消算法: 识别本地误加、误删、误替换，并扣除服务端已声明的变化.
4. 管理员验证发布: 未验证版本成功进服后自动确认，额外客户端改动自动发布下一版.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="SERVER"
