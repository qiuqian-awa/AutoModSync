modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
# issueTrackerURL="https://..."

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="秋千"
credits="XiaoArin"
# logoFile="logo.png"
description='''
${mod_description}

核心特性:
1. 三级校验机制: 本地自检修复 -> 服务端增量同步 -> 权威清单兜底.
2. 仓库备份系统: 自动全量备份成功进服的模组. 误删文件可直接从本地仓库秒恢复.
3. 智能抵消算法: 自动识别"本地误删"与"服务端移除", 避免无效报错.
4. 信道与权威清单: 自动识别仅双端模组, 保护玩家的客户端模组不被误删.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="SERVER"

