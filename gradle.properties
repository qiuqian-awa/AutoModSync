# Gradle
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8

# Mod
mod_version=4.0.0
archives_base_name=AutoModSync
mod_id=automodsync
mod_name=Auto Mod Sync

# NeoForge / Minecraft (NeoForge 21.1.x targets Minecraft 1.21.1 and needs Java 21)
minecraft_version=1.21.1
neo_version=21.1.248
minecraft_version_range=[1.21.1]
neo_version_range=[21.1.248,21.2)
loader_version_range=[4,)

# Metadata
mod_license=MIT
mod_authors=QiuQian
mod_description=Auto Mod Sync - Smart Sync Edition
pack_format=34

# Local development classpath. The build reuses the NeoForge installation that
# is already present on this machine instead of downloading NeoForge again.
# Override on the command line with -PminecraftLibrariesDir=... if needed.
minecraftLibrariesDir=D:/mc/.minecraft/libraries
