plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

// Final file name: AutoModSync-1.21.1-4.0.0.jar
version = "${minecraft_version}-${mod_version}"
group = 'com.example.automodsync'
base.archivesName = archives_base_name

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

println "Java: ${System.getProperty('java.version')} JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')} Arch: ${System.getProperty('os.arch')})"

// ---------------------------------------------------------------------------
// Local NeoForge development classpath
//
// maven.neoforged.net is not reachable from this machine.  A complete NeoForge
// 1.21.1 installation and the NeoFormRuntime cache are already available
// locally, so the build uses those jars directly instead of downloading them.
// This keeps `gradle build` completely offline.
//
// The official-mapped Minecraft + NeoForge classes come from NeoFormRuntime's
// compiledWithNeoForge output.  The requested NeoForge version's universal and
// client jars are put first on the classpath so 21.1.248 APIs take precedence.
// ---------------------------------------------------------------------------
def librariesDir = file(project.findProperty('minecraftLibrariesDir') ?: 'D:/mc/.minecraft/libraries')
def nfrtCacheDir = file("${gradle.gradleUserHomeDir}/caches/neoformruntime/intermediate_results")

def nfUniversal = file("${librariesDir}/net/neoforged/neoforge/${neo_version}/neoforge-${neo_version}-universal.jar")
def nfClient = file("${librariesDir}/net/neoforged/neoforge/${neo_version}/neoforge-${neo_version}-client.jar")
// Pin the FML/bus jars that ship with NeoForge 21.1.248.  The libraries folder
// also contains newer loaders (for 1.21.5/1.21.11) whose annotations differ.
def nfLoader = file("${librariesDir}/net/neoforged/fancymodloader/loader/4.0.43/loader-4.0.43.jar")
def nfBus = file("${librariesDir}/net/neoforged/bus/8.0.5/bus-8.0.5.jar")

def nfrtOverride = project.findProperty('neoformRuntimeJar')
def nfrtCandidates = fileTree(dir: nfrtCacheDir, include: 'compiledWithNeoForge_*_output.jar').files
def nfrtJar = nfrtOverride != null ? file(nfrtOverride)
        : (nfrtCandidates.isEmpty() ? null : nfrtCandidates.max { it.lastModified() })

if (!librariesDir.isDirectory()) {
    throw new GradleException("Minecraft libraries directory not found: ${librariesDir}. " +
            "Pass -PminecraftLibrariesDir=<path-to-.minecraft/libraries>.")
}
if (!nfUniversal.isFile() || !nfClient.isFile()) {
    throw new GradleException("NeoForge ${neo_version} is not installed under ${librariesDir}/net/neoforged/neoforge. " +
            "Install NeoForge ${neo_version} for Minecraft ${minecraft_version} first.")
}
if (nfrtJar == null || !nfrtJar.isFile()) {
    throw new GradleException("NeoFormRuntime compiledWithNeoForge output not found under ${nfrtCacheDir}. " +
            "Build any NeoForge 1.21.1 project once, or pass a prepared jar via -PneoformRuntimeJar=... .")
}
if (!nfLoader.isFile() || !nfBus.isFile()) {
    throw new GradleException("NeoForge 21.1 FML libraries are missing under ${librariesDir}. " +
            "Expected loader-4.0.43.jar and bus-8.0.5.jar.")
}

dependencies {
    // Order matters: 21.1.248 NeoForge classes must win over cached 21.1.233 copies.
    compileOnly files(nfUniversal, nfClient, nfLoader, nfBus, nfrtJar)
    compileOnly fileTree(dir: librariesDir, include: '**/*.jar')
}

repositories {
    // Intentionally empty: this build is fully local/offline.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
            '--add-modules', 'jdk.httpserver',
            '--add-exports', 'jdk.httpserver/com.sun.net.httpserver=ALL-UNNAMED'
    ]
}

// Inject gradle.properties values into the NeoForge metadata.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            pack_format            : pack_format
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
